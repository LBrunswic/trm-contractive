# TRM (MLP-T Sudoku recipe) with contractive-operator extensions. Defaults reproduce TRM exactly.
name: recursive_reasoning.trm_contractive@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 3
L_cycles: 6

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8  # min(2, hidden_size // 64)
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

pos_encodings: none
forward_dtype: bfloat16

mlp_t: True # use mlp on L instead of transformer
puzzle_emb_len: 16 # if non-zero, its specified to this value
no_ACT_continue: True # No continue ACT loss, only use the sigmoid of the halt which makes much more sense

# Euler-TRM: z <- z + h (L_level(z, ctx + temb(t)) - z)
flow: False
flow_h_L: 0.5
flow_h_H: 0.5
flow_time_embed: True
flow_time_freqs: 64

# Contraction regularizer (models/regularizers.py); reg_mode none = monitoring only
reg_mode: none          # none | cycle_lip (V1) | flow_mono (V2) | dec_out (D2) | dec_semi (D-gamma) | dec_block (D1)
reg_eta: 0.05           # V1 target Lip(Phi) <= 1 - eta ; V2 target osl(V) <= -mu, mu = -ln(1-eta)/h
reg_pair: adv
reg_eps_min: 0.05
reg_eps_max: 0.2
reg_frac: 0.25
reg_dual: True
reg_lambda_init: 1.0
reg_lambda_min: 0.01
reg_lambda_max: 100.0
reg_dual_lr: 0.01
reg_target_viol: 0.1
reg_viol_ema: 0.98
reg_monitor_every: 50
reg_monitor_power_iters: 3
